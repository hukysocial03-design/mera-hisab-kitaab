name: Build Mera Hisab Kitab Pro V5

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Magic Setup - Auto Generate Android Project V5
      run: |
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include(":app")
        EOF

        mkdir -p app/src/main/java/com/merahisabkitab/pro
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.2"
            id("org.jetbrains.kotlin.android") version "2.0.21"
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"
            id("com.google.devtools.ksp") version "2.0.21-1.0.27"
        }
        android {
            namespace = "com.merahisabkitab.pro"
            compileSdk = 35
            defaultConfig {
                applicationId = "com.merahisabkitab.pro"
                minSdk = 26
                targetSdk = 35
                versionCode = 5
                versionName = "5.0.0"
            }
            buildFeatures {
                compose = true
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
            implementation("androidx.activity:activity-compose:1.9.2")
            implementation(platform("androidx.compose:compose-bom:2024.09.02"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            
            implementation("androidx.room:room-runtime:2.6.1")
            implementation("androidx.room:room-ktx:2.6.1")
            ksp("androidx.room:room-compiler:2.6.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Mera Hisab Kitab Pro V5" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/merahisabkitab/pro/MainActivity.kt
        package com.merahisabkitab.pro
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.material3.Text
        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent { Text("Mera Hisab Kitab Pro V5 - Premium Edition Ready!") }
            }
        }
        EOF

        gradle wrapper --gradle-version 8.7

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon --stacktrace :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mera-hisab-kitab-pro-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
